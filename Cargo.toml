[package]
name = "atozuke-kage-mod"
version = "0.1.4"
edition = "2021"
description = "Atozuke Kage MOD: add AI shading to an image as a separate shadow layer"
license = "MIT"
repository = "https://github.com/KRHa0024/AtozukeKageMOD"
publish = false

[lib]
name = "kage"
path = "src/lib.rs"

[[bin]]
name = "AtozukeKageMOD"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
webp = { version = "0.3", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
