[package]
name = "atozuke-kage-mod"
version = "0.1.0"
edition = "2021"
description = "Atozuke Kage MOD: add AI shading to an image as a separate shadow layer (UI prototype)"
license = "MIT"
publish = false

[[bin]]
name = "AtozukeKageMOD"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
